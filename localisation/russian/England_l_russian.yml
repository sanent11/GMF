  ENG_Law_name: "Эндрю Бонар Лоу"
  Law_desc: "§HПоследний Викторианец§!\n\nЧеловек эпохи, чья жизнь прошла сквозь огонь и кровь Первой мировой. Его слова — весомый камень в водовороте перемен, а решения — последний рубеж между хаосом и порядком. Лоу — не реформатор и не мечтатель, а хранитель традиций и устоев, которые казались нерушимыми. Он не обещает светлого будущего, но гарантирует, что Британия не погрузится в бездну революций и распрей.\n\nЕго власть — это сила привычки и уважения, сила времени, которое он сам прожил. Но тени перемен уже наступают: молодое поколение не хочет ждать, и за кулисами рождаются идеи, способные изменить страну. Пока Лоу у руля, Британия стоит на распутье между §Bпрошлым§! и §Rбудущим§!.\n\nОднако возраст даёт о себе знать, и время Лоу ограничено. В его тени зреет новое поколение: технократы, реформаторы, модернисты. Но пока он жив — Британия держится."
 #министры
 

