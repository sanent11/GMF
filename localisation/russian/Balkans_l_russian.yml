 #идеи
 makedon_nati: "Македонские националисты"
 makedon_nati_desc: "В македонии орудуют революционеры, желающие свободы своей стране, а некоторые и присоединения к Болгарии. Их явно кто то спонсирует извне, но кто?"
 
 liberalizatia_yugoslavii: "Либерализация"
 liberalizatia_yugoslavii_desc: "В 1933 году был убит наш боговерный Король Александр, давший нам государство балканских славян – новую политическую силу на дипломатической арене Балкан. Его режим был жёстким, но справедливым. Новое правительство Евтича пошло по пути либерализации политического режима."
 
 yug_kurs_nezavisimost: "Югославский курс на полную независимость"
 yug_kurs_nezavisimost_desc: "Стоядзинович желает свободы и стабильности для нашей страны. Поэтому он готов приложить все усилия для мирных отношений с теми кто может попытаться покуситься на нашу свободу."
 
 church_konflict: "Конфликт с церковью"
 church_konflict_desc: "Наша Православная церковь в ярости от того, что православный лидер пошел на договор с католиками. Они явно не оставят это."
