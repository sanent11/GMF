 #идеи
 crisis_govenment: "Кризис в правительстве"
 crisis_govenment_desc: "Уже почти все против нас: те, благодаря кому мы смогли удержаться, уже все больше и больше отворачиваются от нас. В народе мы также теряем популярность. БКП набирает обороты. Денег нет… что же делать. "
 
 memory_terror: "Память террора"
 memory_terror_desc: "Более 15 лет назад положение в стране было патовым, даже хуже чем сейчас. Мы шли на все меры против тесняков, а потом и против БКП за удержание власти. Мы лгали, мы терроризировали их. В 1919 мы уничтожали горный и железнодорожных рабочих 55 дней в горах, моря их голодом И вот, в 1923 году, когда они в очередной раз решились пойти против нас, мы не оставили этого. Мы уничтожили их, казнили всех, даже мелких деятелей. Мы поймали друга Димитрова — Генова, и пытали его, пока тот не умер в тюрьме. И почему это осталось в памяти народа надолго?"

 gorodam_pizdec: "Уничтоженные города"
 gorodam_pizdec_desc: "Мы уничтожили такие  города, как Плевна, Бургас и Варна. Лишь София осталась в качестве города. Мы активно переводим людей в село и в деревню, не всегда спрашивая их. Возможно, им не нравится покидать свой дом."
 
 golod_bulgarii: "Голод"
 golod_bulgarii_desc: "Хоть мы и аграрная страна, но даже так мы умудрились дойти до голода. Мы вынуждены выплачивать другим странам наши долги хлебом, но это ещё не всё. Кулаки активно отбирают весь хлеб у батраков и бедняков, оставляя их на верную смерть. Мы бы хотели что-нибудь сделать с этим, но кулаки — наши верные братья. Возможно, это нравится не всем."
 
 
 
 
 
 
 