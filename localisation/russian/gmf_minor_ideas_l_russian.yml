l_russian:
  AUS_rising_unemployment: "Рост безработицы"
  AUS_rising_unemployment_desc: "Австрийское общество стремительно нищает, фабрики массово закрываются, рабочих оставляют на произвол судьбы."
  AUS_Conflict_between_left_and_right: "Конфликт левых и правых"
  AUS_Conflict_between_left_and_right_desc: "Парламент Австрии очень давно раскалывается, а политические решения почти не принимаются из-за того, что противоборствующие партии намеренно тормозят принятие решений противникам. "
  AUS_Heimwehr: "Хеймвер"
  AUS_Heimwehr_desc: "Хеймвер – военизированное националистическое объединение, помогающее правительству в сохранении стабильности и борьбе с оппозицией. Вальдемар Пабст – лидер хеймвера, активно поддерживает Отечественный фронт и помогает развиваться Австрии."