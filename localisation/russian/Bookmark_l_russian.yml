l_russian:

GMF_NAME: "Начало Великого Марша"
GMF_DESC: "Трагедия кризисов рождает зарю, возвещающую об уходе старого порядка и возвышению новых героев поколений, новых устремлений цивилизаций. Заря, переливающаяся в кризисах и лишениях, трубит о скором начале крупнейшей войны в истории - войны, которая по настоящему положит конец всем войнам."