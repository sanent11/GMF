 ENG_IF_definition_loc: "§HАнглийский Король§!"
 ENG_Edward_VIII: "Его Величество Король Великобритании: §HЭдуард VIII!§!\n\n\n\n\n\n\n\n   £GFX_ENG_Edward_port\n\n\n\n\n\n\n\n\n«Король современного разочарования», он вызывает симпатию, но и тревогу. Его роман с независимостью — это роман всего нового поколения. Его слабость — в отказе играть роль, которую требует история. Пока Бонар Лоу удерживает страну в узде традиций, Эдуард VIII невольно становится символом того, что однажды разрушит старый порядок — сомнения, усталости и желания жить иначе.\n\nНо, возможно, именно таким и должен быть монарх в эпоху, где власть и символы больше не совпадают.\n-------------------------------------"